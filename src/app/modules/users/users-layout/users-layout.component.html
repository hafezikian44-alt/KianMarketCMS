<section class="m-5">
  <h3 class="mb-1 fw-bold">مدیریت کاربران</h3>
  <p class="mb-4">کاربران پلتفرم را از این جا مدیریت کنید.</p>
  <article class="panel products-panel" id="products">
    <header class="panel-header">
      <div class="text-light">
        <h2 class="fs-6">لیست کاربران</h2>
        <p>کاربران را مدیریت کنید.</p>
      </div>
      <label class="search-box"
        ><span>⌕</span
        ><input
          id="product-search"
          type="search"
          placeholder="جستجوی کاربر..."
          aria-label="جستجوی کاربر"
      /></label>
    </header>
    <div class="table-scroll">
      <table class="products-table">
        <thead>
          <tr class="table-header">
            <th class="text-light" style="font-size: 14px">
              نام و نام خانوادگی
            </th>
            <th class="text-light" style="font-size: 14px">نام کاربری</th>
            <th class="text-light" style="font-size: 14px">ایمیل</th>
            <th class="text-light" style="font-size: 14px">رمز عبور</th>
          </tr>
        </thead>
        <tbody id="product-list" *ngFor="let user of usersList">
          <tr class="product-ditale">
            <td>
              <div class="product-cell">
                <span class="fw-bold text-light"
                  >{{ user.firstName }} {{ user.lastName }}
                </span>
              </div>
            </td>
            <td class="price text-light" style="font-size: 12px">
              {{ user.username }}
            </td>
            <td>
              <span class="text-light" style="font-size: 12px">{{
                user.email
              }}</span>
            </td>
            <td>
              <span class="text-light" style="font-size: 12px">{{
                user.password
              }}</span>
            </td>
            <td>
              <div class="actions">
                <button class="action-btn edit-btn" aria-label="ویرایش کاربر">
                  ✎</button
                ><button class="action-btn delete-btn" aria-label="حذف کاربر">
                  ×
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <footer class="panel-footer">
      <span class="text-light" id="product-total"
        >نمایش {{ usersList?.length }} کاربر</span
      >
      <div class="pagination">
        <button aria-label="صفحه قبل">‹</button
        ><button class="selected">۱</button><button>۲</button><button>۳</button
        ><button aria-label="صفحه بعد">›</button>
      </div>
    </footer>
  </article>
</section>
