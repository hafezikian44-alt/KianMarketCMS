<div class="modal-overlay" *ngIf="openModal">
  <div class="logout-modal" dir="rtl">
    <button class="close-btn" type="button" (click)="onCloseModal()">
      &times;
    </button>

    <div class="modal-icon">
      <span>✎</span>
    </div>

    <div class="modal-content">
      <h2>ویرایش محصول</h2>

      <form>
        <div class="form-group">
          <label for="productTitle">عنوان محصول</label>
          <input
            id="productTitle"
            type="text"
            name="title"
            [(ngModel)]="newTitle"
            placeholder="عنوان محصول را وارد کنید"
            required
          />
        </div>

        <div class="form-group">
          <label for="productPrice">قیمت محصول (دلار)</label>
          <input
            id="productPrice"
            type="number"
            name="price"
            [(ngModel)]="newPrice"
            placeholder="قیمت محصول را وارد کنید"
            min="0"
            required
          />
        </div>

        <div class="modal-actions">
          <button class="logout-btn" type="button" (click)="onCloseModal()">
            بستن
          </button>

          <button class="edit-btn" type="submit">ثبت تغییرات</button>
        </div>
      </form>
    </div>
  </div>
</div>
