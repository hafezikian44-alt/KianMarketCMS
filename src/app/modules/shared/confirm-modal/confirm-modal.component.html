<div class="modal-overlay" *ngIf="openModal">
  <div class="logout-modal" dir="rtl">
    <button class="close-btn" type="button" (click)="onCloseDeleteModal()">
      &times;
    </button>

    <div class="modal-icon">
      <span>!!</span>
    </div>

    <div class="modal-content">
      <h2>حذف محصول</h2>

      <p>
        آیا مطمعن هستید که می خواهید محصول {{ confirmProduct?.title }} با شناسه
        ی {{ confirmProduct?.id }} را حذف کنید؟
      </p>
      <div class="d-flex justify-content-between">
        <button class="logout-btn" type="button" (click)="onCloseDeleteModal()">
          بستن
        </button>
        <button class="delete-btn" type="button" (click)="onDeleteProduct()">
          حذف
        </button>
      </div>
    </div>
  </div>
</div>
