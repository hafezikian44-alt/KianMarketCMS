<aside class="sidebar">
  <a class="brand" href="#dashboard">
    <span class="brand-logo">◆</span>
    <span class="brand-copy"
      ><strong class="fw-bold fs-6">کیان مارکت</strong>پنل مدیریت فروشگاه</span
    >
  </a>
  <p class="nav-heading">منوی اصلی</p>
  <nav class="nav">
    <a class="nav-link" routerLink="/dashboard" routerLinkActive="active"
      ><span class="nav-icon">▦</span
      ><span class="nav-responsive">داشبورد</span></a
    >
    <div class="accordion" id="mainAccordion">
      <div>
        <a
          class="nav-link mb-2 accordion-header"
          routerLink="/products"
          routerLinkActive="active"
          data-bs-toggle="collapse"
          data-bs-target="#productsCollapse"
          aria-expanded="false"
          aria-controls="productsCollapse"
        >
          <span class="nav-icon">◇</span>
          <span class="nav-responsive">محصولات</span>
        </a>

        <div
          id="productsCollapse"
          class="accordion-collapse collapse"
          data-bs-parent="#mainAccordion"
        >
          <div class="accordion-body">
            <button
              class="btn btn-primary mb-2 w-100"
              (click)="onResetFilter()"
            >
              rerset
            </button>
            <div class="d-flex gap-1">
              <input
                class="input-group form-control"
                type="search"
                placeholder="جستجو ..."
              />
              <button class="btn btn-primary">⌕</button>
            </div>

            <ul class="list-group category-list mt-2">
              <li class="list-group-item" *ngFor="let category of categories">
                <a
                  class="text-decoration-none"
                  (click)="onCategory(category.slug); $event.preventDefault()"
                  >{{ category.name }}</a
                >
              </li>
            </ul>
          </div>
        </div>

        <a
          class="nav-link mb-2 accordion-header"
          routerLink="/users"
          routerLinkActive="active"
          data-bs-toggle="collapse"
          data-bs-target="#usersCollapse"
          aria-expanded="false"
          aria-controls="usersCollapse"
        >
          <span class="nav-icon">♙</span>
          <span class="nav-responsive">کاربران</span>
        </a>

        <div
          id="usersCollapse"
          class="accordion-collapse collapse"
          data-bs-parent="#mainAccordion"
        >
          <div class="accordion-body">
            <strong>متن تستی کاربران</strong>
          </div>
        </div>
      </div>
      <a class="nav-link" routerLink="/about-program" routerLinkActive="active"
        ><span class="nav-icon">▦</span
        ><span class="nav-responsive">درباره ی نرم افزار</span></a
      >
    </div>
  </nav>
  <div class="sidebar-bottom">
    <div class="d-flex align-items-center">
      <span class="status-dot"></span>
      <p class="fw-bold mb-0">سیستم فعال است</p>
    </div>
    <p style="font-size: 12px">نسخه 1.0.0</p>
  </div>
</aside>
